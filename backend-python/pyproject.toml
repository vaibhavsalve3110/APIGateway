[project]
name = "apigw-platform-backend"
version = "0.1.0"
description = "FastAPI control plane for the API Gateway platform. Runs against the same PostgreSQL schema and the same JWT secret as backend-java, so the two can serve the portals side by side during the migration."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.118,<0.120",
    "uvicorn[standard]>=0.37,<0.40",
    # SQLAlchemy is used for connection pooling and typed execution; the schema itself belongs to
    # Flyway in backend-java, so there are no models here and no autogenerated DDL.
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "asyncpg>=0.30,<0.31",
    "pydantic[email]>=2.11,<3",
    "pydantic-settings>=2.11,<3",
    "pyjwt>=2.10,<3",
    "httpx>=0.28,<0.29",
    "cryptography>=46,<47",
    "pillow>=11,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI declares dependencies
# (`conn: AsyncConnection = Depends(connection)`). The rule does not apply to this framework.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
