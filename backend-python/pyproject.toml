[project]
name = "apigw-platform-backend"
version = "0.1.0"
description = "FastAPI control plane for the API Gateway platform. Runs against the same PostgreSQL schema and the same JWT secret as backend-java, so the two can serve the portals side by side during the migration."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.162,<0.163",
    # Not used directly — fastapi brings it — but named here as a security floor. starlette 0.48,
    # which the 0.118 range resolved to, carried three advisories whose fixes land in 0.49.1, 1.1.0
    # and 1.3.1 respectively, so clearing all three means 1.3.1 or later and that in turn means a
    # current fastapi. This line is what stops a later fastapi range quietly resolving back below it.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.37,<0.40",
    # SQLAlchemy is used for connection pooling and typed execution; the schema itself belongs to
    # Flyway in backend-java, so there are no models here and no autogenerated DDL.
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "asyncpg>=0.30,<0.31",
    "pydantic[email]>=2.11,<3",
    "pydantic-settings>=2.11,<3",
    "pyjwt>=2.10,<3",
    "httpx>=0.28,<0.29",
    # 50 and not 46: three advisories against 46 — the bundled OpenSSL, a Bleichenbacher oracle in
    # PKCS#7 decryption, and exponential certificate path building — and their fixes land in 48, 49
    # and 50 respectively. Only the first touches anything this service does (it is the OpenSSL
    # under our own RSA and AES), but the floor may as well clear all three.
    "cryptography>=50,<51",
    # Draws the sign-in CAPTCHA, and that is all it does. 11.3.0 carries five critical advisories,
    # every one of them in a *decoder* — TIFF, FlashPix, JPEG — or in the Ghostscript shell-out.
    # This service decodes no images at all, so none was reachable; the floor is raised anyway
    # because a scan report that needs that paragraph beside it is worse than an upgrade.
    "pillow>=13,<14",
    # Reads Swagger/OpenAPI YAML on import. Always via safe_load — see app/importer.py.
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI declares dependencies
# (`conn: AsyncConnection = Depends(connection)`). The rule does not apply to this framework.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
