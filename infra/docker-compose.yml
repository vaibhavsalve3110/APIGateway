# Local stack for the API Gateway platform.
#
#   docker compose up -d                 # infrastructure only; run the backend + portals on the host
#   docker compose --profile app up -d --build   # the whole platform in containers behind nginx/TLS
#
# Before the first --profile app run, create the development certificates:
#   ../nginx/make-certs.sh
#
# Then everything is reached over https, by name:
#   https://admin.apigw.com         Management Portal
#   https://developer.apigw.com     Developer Portal
#   https://sandbox-api.apigw.com   partner traffic -> APISIX sandbox
#   https://api.apigw.com           partner traffic -> APISIX production
#
# Works with Docker Engine (Linux / WSL2), Rancher Desktop or Podman. Docker Desktop needs a paid
# subscription in organisations above 250 staff or $10M revenue.
#
# Two APISIX deployments share one etcd under different prefixes: the Sandbox gateway only ever holds
# sandbox Client IDs and keys, so a sandbox key cannot authenticate on Production (BRD GW-05).

name: apigw

x-apisix: &apisix
  # Built, not pulled: the published image's Debian packages are behind Debian's own patch level,
  # including openssl. The APISIX version itself is untouched — see apisix-image/Dockerfile.
  build:
    context: ./apisix-image
  image: apigw-apisix:latest
  restart: unless-stopped
  depends_on:
    etcd:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"   # lets the gateways ship usage logs to a backend running on the host

services:
  # Disposable PostgreSQL for a machine that has none. It does NOT start by default: the stack points
  # at whatever DB_HOST names, which is the developer machine's own PostgreSQL unless you change it.
  #
  #   docker compose --profile app --profile bundled-db up -d     (use this container instead)
  #
  # and in infra/.env set DB_HOST=postgres, DB_PORT=5432, DB_SCHEMA=public plus a DB_PASSWORD of your
  # choosing — the bundled server is created with whatever that says.
  postgres:
    profiles: ["bundled-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apigw
      POSTGRES_USER: apigw
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apigw}
    # 55432 on the host: the developer machine already runs PostgreSQL on 5432 and the two must not fight.
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apigw -d apigw"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    # Loopback only. Published on every interface this was a Redis-compatible store with no
    # password on 0.0.0.0:6379 — readable and writable by anything on the same network, and a
    # well-worn route to code execution. It holds the gateways' rate-limit counters; the gateways
    # reach it by container name on the compose network and do not need a published port at all.
    # A production deployment needs both a password and a private network.
    ports: ["127.0.0.1:6379:6379"]

  etcd:
    # Official image — the Bitnami etcd image used in most APISIX examples was withdrawn in 2025.
    image: quay.io/coreos/etcd:v3.5.33
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes: ["etcddata:/etcd-data"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      retries: 20

  apisix-sandbox:
    <<: *apisix
    environment:
      APISIX_ADMIN_KEY: ${APISIX_SANDBOX_ADMIN_KEY:-change-me-sandbox-admin-key}
      APISIX_ETCD_PREFIX: /apisix-sandbox
    volumes: ["./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro"]
    ports:
      - "127.0.0.1:9080:9080"   # partner traffic — normally reached as sandbox-api.apigw.com
      - "127.0.0.1:9180:9180"   # Admin API — creates routes; guarded only by the admin key

  apisix-production:
    <<: *apisix
    environment:
      APISIX_ADMIN_KEY: ${APISIX_PRODUCTION_ADMIN_KEY:-change-me-production-admin-key}
      APISIX_ETCD_PREFIX: /apisix-production
    volumes: ["./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro"]
    ports:
      - "127.0.0.1:9081:9080"   # partner traffic — normally reached as api.apigw.com
      - "127.0.0.1:9181:9180"   # Admin API — creates routes; guarded only by the admin key

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry this issuer, whether Keycloak is reached from the browser or from a container.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    # Loopback only: nothing connects to this and its admin password defaults to "admin".
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["./keycloak/realm-apigw.json:/opt/keycloak/data/import/realm-apigw.json:ro"]

  # ------------------------------------------------------------------ the core-banking stand-ins
  #
  # Gone from here. The two WireMock servers that stood in for the bank's core systems live in
  # their own project now — ../../mock-upstreams — because they existed only to demonstrate the
  # platform and nothing here depends on them: with both stopped, all 22 sanity checks and all 18
  # test gates pass. The upstream URLs that reference them are stored configuration, not calls this
  # platform makes on its own behalf.
  #
  # To bring them back for a demo, start this stack first and then, from that project:
  #
  #   docker compose -f docker-compose.yml -f docker-compose.apigw.yml up -d
  #
  # That attaches them to this stack's network under the names the seeded APIs point at,
  # `mock-sandbox` and `mock-production`, so nothing in the database needs changing.
  #
  # The last commit that still had them here is on the branch archive/wiremock-mock-upstreams.

  # ------------------------------------------------------------------ the platform itself
  # Everything below runs only under --profile app.

  # Java control plane. Owns the schema: Flyway runs here at startup, and backend-python reads the
  # result, so this service must be healthy before the Node one is useful.
  # RETIRED from the running platform. Everything it owned — the schema, the three scheduled jobs,
  # Try it live, the Swagger/Postman importer and the demo seeder — is in backend-python now, and
  # nginx routes nothing here. It is kept on its own profile, so it does not start with the stack,
  # because twelve test gates still cross-check backend-python against it and that has caught real
  # defects. Start it only for that:  docker compose --profile app --profile java up -d
  backend-java:
    profiles: ["java"]
    build: ../backend-java
    restart: unless-stopped
    # host.docker.internal is the developer machine as seen from inside a container. Docker Desktop
    # provides it; the mapping below is what makes it work on plain Docker Engine too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Overridable, because it was hardcoded while ENVIRONMENT on backend-python was not: the two
      # decide the same thing — whether a missing secret is fatal and whether encryption is enforced
      # — so a stack could be switched to production on one service and not the other. Set BOTH
      # (SPRING_PROFILES_ACTIVE=prod and ENVIRONMENT=production) or neither.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      # Schema is named explicitly rather than by activating the 'local' profile, which would also
      # switch on header-based dev authentication and switch off gateway sync — neither wanted here.
      DB_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/apigw?currentSchema=${DB_SCHEMA:-apim}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env to the password of the database DB_HOST points at}
      SPRING_FLYWAY_SCHEMAS: ${DB_SCHEMA:-apim}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${DB_SCHEMA:-apim}
      SPRING_FLYWAY_CREATE_SCHEMAS: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${DB_SCHEMA:-apim}
      # Both control planes verify the same signature, so one portal session works against either.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in infra/.env — 32+ characters}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:-}
      APISIX_SANDBOX_ADMIN_URL: http://apisix-sandbox:9180
      APISIX_SANDBOX_ADMIN_KEY: ${APISIX_SANDBOX_ADMIN_KEY:-change-me-sandbox-admin-key}
      APISIX_PRODUCTION_ADMIN_URL: http://apisix-production:9180
      APISIX_PRODUCTION_ADMIN_KEY: ${APISIX_PRODUCTION_ADMIN_KEY:-change-me-production-admin-key}
      GATEWAY_REDIS_HOST: valkey
      # Where the gateways post their usage batches. They reach the control plane directly rather
      # than through nginx, so this variable -- not an nginx line -- is what moves this one route
      # between the services, and what moves it back.
      USAGE_SINK_URL: http://backend-python:8090/internal/usage/batch
      USAGE_INGEST_TOKEN: ${USAGE_INGEST_TOKEN:-change-me-ingest-token}
      # Gmail needs an App Password, not the account password, and 2-Step Verification must be on.
      # Leave SMTP_HOST empty to run without mail: one-time codes are logged and shown in the portal.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # application.yml reads this, but it was never passed through, so a value in infra/.env had
      # no effect here. Its yml default is true, which is why 587 worked anyway.
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@apigw.local}
      # Payload encryption. **The same key must reach backend-python below**: nginx routes portal
      # traffic between the two per path, so a payload encrypted once may arrive at either. Both
      # services read these and neither was given them, so a containerised deployment had no way to
      # configure the keypair at all — it silently used the development one committed to the repo,
      # and under a production profile simply refused to start.
      PAYLOAD_PRIVATE_KEY: ${PAYLOAD_PRIVATE_KEY:-}
      PAYLOAD_ENCRYPTION_ENFORCED: ${PAYLOAD_ENCRYPTION_ENFORCED:-false}
      # Try it live. Both services defaulted the sandbox URL to localhost:9080, which inside a
      # container is the container itself, so this could never have worked in this stack.
      TRY_IT_MODE: ${TRY_IT_MODE:-GATEWAY}
      TRY_IT_SANDBOX_URL: ${TRY_IT_SANDBOX_URL:-http://apisix-sandbox:9080}
      PUBLIC_SANDBOX_URL: https://sandbox-api.apigw.com
    # 18088 on the host is for the parity harness and ad-hoc debugging only; partner and portal
    # traffic always arrives through nginx.
    ports: ["127.0.0.1:18088:8088"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 10

  # The control plane. Owns the schema, the background jobs and every route the platform serves.
  backend-python:
    profiles: ["app"]
    build:
      context: ../backend-python
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Mirrors SPRING_PROFILES_ACTIVE on backend-java, because it decides the same thing: whether
      # a missing CRYPTO_MASTER_KEY or AUTH_JWT_SECRET is fatal. The Java service runs the demo
      # profile here, so this must not say production or the two disagree about the same database.
      ENVIRONMENT: ${ENVIRONMENT:-demo}
      # asyncpg, not psycopg: a blocking driver would stall the event loop. The schema travels in
      # DB_SCHEMA rather than the URL, because asyncpg rejects libpq query parameters.
      DATABASE_URL: postgresql+asyncpg://apigw:${DB_PASSWORD:?set DB_PASSWORD in infra/.env}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/apigw
      DB_SCHEMA: ${DB_SCHEMA:-apim}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in infra/.env — 32+ characters}
      # The gateways present this on every usage batch; both control planes must expect the same one.
      USAGE_INGEST_TOKEN: ${USAGE_INGEST_TOKEN:-change-me-ingest-token}
      # Shown to partners on an API page; must match what backend-java tells them.
      PUBLIC_SANDBOX_URL: ${PUBLIC_SANDBOX_URL:-https://sandbox-api.apigw.com}
      TRY_IT_MODE: ${TRY_IT_MODE:-GATEWAY}
      # Where a Try-it-live call actually goes. Both services defaulted this to localhost:9080,
      # which inside a container is the container itself — so Try it live could never have worked
      # in this stack, on either control plane. This is the gateway's data port by container name.
      TRY_IT_SANDBOX_URL: ${TRY_IT_SANDBOX_URL:-http://apisix-sandbox:9080}
      # Both control planes configure the same two gateways, so these must match backend-java's.
      GATEWAY_SYNC_ENABLED: ${GATEWAY_SYNC_ENABLED:-true}
      APISIX_SANDBOX_ADMIN_URL: http://apisix-sandbox:9180
      APISIX_SANDBOX_ADMIN_KEY: ${APISIX_SANDBOX_ADMIN_KEY:-change-me-sandbox-admin-key}
      APISIX_PRODUCTION_ADMIN_URL: http://apisix-production:9180
      APISIX_PRODUCTION_ADMIN_KEY: ${APISIX_PRODUCTION_ADMIN_KEY:-change-me-production-admin-key}
      GATEWAY_REDIS_HOST: valkey
      GATEWAY_SANDBOX_HOSTS: sandbox-api.apigw.com
      GATEWAY_PRODUCTION_HOSTS: api.apigw.com
      # Mail. These were missing entirely until 2026-10-21, so this service fell back to its
      # "no SMTP host" branch and logged every notice no matter what infra/.env said, while
      # backend-java — which does receive them — sent. Sign-in codes and key-rotation notices both
      # go out from whichever service answered the request, so the two must be configured alike or
      # delivery depends on which one nginx happened to route to.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@apigw.local}
      # Whether the new key itself goes to the Partner Admins. backend-java reads this from the
      # environment too, so leaving it out here let the two services disagree about it.
      EMAIL_KEY_TO_ADMIN: ${EMAIL_KEY_TO_ADMIN:-true}
      # Payload encryption, the same two values backend-java above is given. They must be identical:
      # the portal encrypts to one public key and nginx decides which service decrypts it.
      PAYLOAD_PRIVATE_KEY: ${PAYLOAD_PRIVATE_KEY:-}
      PAYLOAD_ENCRYPTION_ENFORCED: ${PAYLOAD_ENCRYPTION_ENFORCED:-false}
      # Whether /swagger-ui.html, /redoc and /v3/api-docs exist. Unset follows ENVIRONMENT: served
      # everywhere except production. Set it to true to keep the reference in production anyway.
      DOCS_ENABLED: ${DOCS_ENABLED:-}
      # Deliberately not passed: TOKEN_TTL_HOURS, OTP_TTL_MINUTES, OTP_LENGTH, the OTP rate limits
      # and KEY_OVERLAP_MINUTES. This service reads all of them, but backend-java hardcodes the
      # equivalents in application.yml (token-ttl PT8H, otp-ttl PT5M, resend-cooldown PT30S,
      # overlap-window PT20M). Making them settable on this side alone would mean a value in
      # infra/.env that one service honours and the other ignores — and a code minted by one is
      # verified by whichever answers the next request. The defaults in settings.py already match
      # those four. To change any of them, change both services together.
      PORT: 8090
    # 18090 on the host, same reason as backend-java above.
    ports: ["127.0.0.1:18090:8090"]

  management-portal:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        APP: management-portal
    restart: unless-stopped
    expose: ["80"]

  developer-portal:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        APP: developer-portal
    restart: unless-stopped
    expose: ["80"]

  # The only service publishing a port to the outside world. Terminates TLS with the self-signed
  # certificate from infra/nginx/make-certs.sh and routes by hostname.
  nginx:
    profiles: ["app"]
    # Built, not pulled: the published alpine tag carries a long list of already-fixed Alpine
    # advisories. nginx/Dockerfile is two lines on top of it. See that file.
    build:
      context: ./nginx
    image: apigw-nginx:latest
    restart: unless-stopped
    depends_on: [backend-python, management-portal, developer-portal]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Strict-Transport-Security, rendered into the config by the nginx image's envsubst
      # entrypoint. **Always declared, even when empty**: an undefined variable would be left in
      # the rendered file literally and served as the header value. Empty means nginx omits the
      # header, which is what a developer machine wants — the certificate here is self-signed and
      # the names sit under a domain nobody here owns, so pinning them to https in the browser
      # would outlive the stack. Production sets:
      #
      #   NGINX_HSTS=max-age=31536000; includeSubDomains
      NGINX_HSTS: ${NGINX_HSTS:-}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      # The shared response headers and the three Content-Security-Policy variants.
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Rendered to /etc/nginx/conf.d at start-up. Without this mount nginx will not start, which is
      # deliberate: see snippets/security-headers.conf.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./docker/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  etcddata:
