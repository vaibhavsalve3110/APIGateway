# Local stack for the API Gateway platform.
#
#   docker compose up -d                 # infrastructure only; run the backend + portals on the host
#   docker compose --profile app up -d --build   # the whole platform in containers behind nginx/TLS
#
# Before the first --profile app run, create the development certificates:
#   ../nginx/make-certs.sh
#
# Then everything is reached over https, by name:
#   https://admin.apigw.com         Management Portal
#   https://developer.apigw.com     Developer Portal
#   https://sandbox-api.apigw.com   partner traffic -> APISIX sandbox
#   https://api.apigw.com           partner traffic -> APISIX production
#
# Works with Docker Engine (Linux / WSL2), Rancher Desktop or Podman. Docker Desktop needs a paid
# subscription in organisations above 250 staff or $10M revenue.
#
# Two APISIX deployments share one etcd under different prefixes: the Sandbox gateway only ever holds
# sandbox Client IDs and keys, so a sandbox key cannot authenticate on Production (BRD GW-05).

name: apigw

x-apisix: &apisix
  image: apache/apisix:3.18.0-debian
  restart: unless-stopped
  depends_on:
    etcd:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"   # lets the gateways ship usage logs to a backend running on the host

services:
  # Disposable PostgreSQL for a machine that has none. It does NOT start by default: the stack points
  # at whatever DB_HOST names, which is the developer machine's own PostgreSQL unless you change it.
  #
  #   docker compose --profile app --profile bundled-db up -d     (use this container instead)
  #
  # and in infra/.env set DB_HOST=postgres, DB_PORT=5432, DB_SCHEMA=public plus a DB_PASSWORD of your
  # choosing — the bundled server is created with whatever that says.
  postgres:
    profiles: ["bundled-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apigw
      POSTGRES_USER: apigw
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apigw}
    # 55432 on the host: the developer machine already runs PostgreSQL on 5432 and the two must not fight.
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apigw -d apigw"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  etcd:
    # Official image — the Bitnami etcd image used in most APISIX examples was withdrawn in 2025.
    image: quay.io/coreos/etcd:v3.5.33
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes: ["etcddata:/etcd-data"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      retries: 20

  apisix-sandbox:
    <<: *apisix
    environment:
      APISIX_ADMIN_KEY: ${APISIX_SANDBOX_ADMIN_KEY:-change-me-sandbox-admin-key}
      APISIX_ETCD_PREFIX: /apisix-sandbox
    volumes: ["./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro"]
    ports:
      - "9080:9080"   # partner traffic — also fronted by nginx as sandbox-api.apigw.com
      - "9180:9180"   # Admin API (backend only)

  apisix-production:
    <<: *apisix
    environment:
      APISIX_ADMIN_KEY: ${APISIX_PRODUCTION_ADMIN_KEY:-change-me-production-admin-key}
      APISIX_ETCD_PREFIX: /apisix-production
    volumes: ["./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro"]
    ports:
      - "9081:9080"   # partner traffic — also fronted by nginx as api.apigw.com
      - "9181:9180"   # Admin API (backend only)

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry this issuer, whether Keycloak is reached from the browser or from a container.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8180:8080"]
    volumes: ["./keycloak/realm-apigw.json:/opt/keycloak/data/import/realm-apigw.json:ro"]

  # Stand-ins for the internal core-banking APIs the gateway fronts.
  mock-sandbox:
    image: wiremock/wiremock:3.13.2
    restart: unless-stopped
    command: ["--global-response-templating", "--disable-banner"]
    volumes: ["./mocks/sandbox:/home/wiremock"]
    ports: ["8091:8080"]

  mock-production:
    image: wiremock/wiremock:3.13.2
    restart: unless-stopped
    command: ["--global-response-templating", "--disable-banner"]
    volumes: ["./mocks/production:/home/wiremock"]
    ports: ["8092:8080"]

  # ------------------------------------------------------------------ the platform itself
  # Everything below runs only under --profile app.

  # Java control plane. Owns the schema: Flyway runs here at startup, and backend-node reads the
  # result, so this service must be healthy before the Node one is useful.
  backend-java:
    profiles: ["app"]
    build: ../backend-java
    restart: unless-stopped
    # host.docker.internal is the developer machine as seen from inside a container. Docker Desktop
    # provides it; the mapping below is what makes it work on plain Docker Engine too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      # Schema is named explicitly rather than by activating the 'local' profile, which would also
      # switch on header-based dev authentication and switch off gateway sync — neither wanted here.
      DB_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/apigw?currentSchema=${DB_SCHEMA:-apim}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env to the password of the database DB_HOST points at}
      SPRING_FLYWAY_SCHEMAS: ${DB_SCHEMA:-apim}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${DB_SCHEMA:-apim}
      SPRING_FLYWAY_CREATE_SCHEMAS: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${DB_SCHEMA:-apim}
      # Both control planes verify the same signature, so one portal session works against either.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in infra/.env — 32+ characters}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:-}
      APISIX_SANDBOX_ADMIN_URL: http://apisix-sandbox:9180
      APISIX_SANDBOX_ADMIN_KEY: ${APISIX_SANDBOX_ADMIN_KEY:-change-me-sandbox-admin-key}
      APISIX_PRODUCTION_ADMIN_URL: http://apisix-production:9180
      APISIX_PRODUCTION_ADMIN_KEY: ${APISIX_PRODUCTION_ADMIN_KEY:-change-me-production-admin-key}
      GATEWAY_REDIS_HOST: valkey
      USAGE_SINK_URL: http://backend-java:8088/internal/usage/batch
      USAGE_INGEST_TOKEN: ${USAGE_INGEST_TOKEN:-change-me-ingest-token}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@apigw.local}
      PUBLIC_SANDBOX_URL: https://sandbox-api.apigw.com
    expose: ["8088"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 10

  # NestJS control plane. Reads the same database; the schema is migrated by backend-java, never by
  # Prisma, so this service waits for that one to be healthy before it starts.
  backend-node:
    profiles: ["app"]
    build:
      context: ../backend-node
    restart: unless-stopped
    depends_on:
      backend-java:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://apigw:${DB_PASSWORD:?set DB_PASSWORD in infra/.env}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/apigw?schema=${DB_SCHEMA:-apim}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in infra/.env — 32+ characters}
      PORT: 8089
    expose: ["8089"]

  management-portal:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        APP: management-portal
    restart: unless-stopped
    expose: ["80"]

  developer-portal:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        APP: developer-portal
    restart: unless-stopped
    expose: ["80"]

  # The only service publishing a port to the outside world. Terminates TLS with the self-signed
  # certificate from infra/nginx/make-certs.sh and routes by hostname.
  nginx:
    profiles: ["app"]
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [backend-java, backend-node, management-portal, developer-portal]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  etcddata:
