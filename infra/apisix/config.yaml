# Shared by the sandbox and production gateways; each container sets its own admin key and etcd prefix.
apisix:
  node_listen: 9080
  enable_ipv6: false
  # Credentials in etcd are encrypted with this keyring (keys must be 16 characters).
  # Replace this demo value before any shared use.
  data_encryption:
    enable_encrypt_fields: true
    keyring:
      - "apigwDemoKey2026"

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key_required: true
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    # Development only: in production restrict the Admin API to the platform backend's network.
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180
  etcd:
    host:
      - "http://etcd:2379"
    prefix: ${{APISIX_ETCD_PREFIX}}
    timeout: 30
