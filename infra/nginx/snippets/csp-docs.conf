# Content-Security-Policy for the API reference at /swagger-ui.html.
#
# Looser than the portals' by necessity: FastAPI's documentation page is an inline script that
# bootstraps Swagger UI, and the bundle itself comes from jsdelivr. That is why this policy is
# scoped to those two locations rather than relaxing the whole site, and why the page is not served
# under the production profile at all — see settings.docs_enabled.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'" always;
