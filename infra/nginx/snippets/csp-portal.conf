# Content-Security-Policy for the two portals.
#
# Both are Vite builds: one module script and one stylesheet, both same-origin, no inline script in
# index.html. So script-src is 'self' with nothing added — which is the directive that matters, and
# the one that turns a stored-XSS finding into a non-event.
#
# Two concessions, both real and both narrow:
#
#   'unsafe-inline' in style-src — the React components set ~370 inline style attributes, and CSP
#   cannot distinguish those from an injected one. Styles are not script; the residual risk is
#   restyling, not execution. Removing it means moving those into the stylesheet.
#
#   fonts.googleapis.com / fonts.gstatic.com — packages/ui/src/styles.css @imports IBM Plex from
#   Google Fonts. That is a third-party request from an administrative portal, and self-hosting the
#   two font files would remove both this exception and that request.
#
# data: in img-src is for the sign-in CAPTCHA, which arrives as a data:image/png from
# /api/auth/captcha rather than as a URL.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
