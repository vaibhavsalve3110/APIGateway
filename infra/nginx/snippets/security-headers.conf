# Response headers every site in nginx.conf sets. Included at server level, and again inside any
# location that sets its own Content-Security-Policy — nginx *replaces* inherited add_header
# directives as soon as a location declares one of its own, so a location with a CSP and without
# this include would quietly lose all of the headers below.
#
# The CSP itself is not here: it differs per site (csp-portal.conf, csp-docs.conf, csp-api.conf).

# Stop a browser from guessing a content type and treating, say, an uploaded OpenAPI file as HTML.
add_header X-Content-Type-Options nosniff always;

# Framing. frame-ancestors in the CSP is the modern form and covers the same ground; this one is
# kept because it is what older browsers and most scanners look for.
add_header X-Frame-Options DENY always;

# A partner id or an API path in a URL never leaves on a cross-origin referer.
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Nothing here opens popups, so severing the window relationship costs nothing and denies a
# cross-origin opener any handle on these documents.
add_header Cross-Origin-Opener-Policy same-origin always;

# None of these portals use any of this hardware. Saying so explicitly means an injected script
# cannot either.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Legacy Flash/Acrobat cross-domain policy files. Nothing serves one; this says so.
add_header X-Permitted-Cross-Domain-Policies none always;

# Strict-Transport-Security, generated from $NGINX_HSTS by the nginx image's envsubst entrypoint —
# see templates/hsts.conf.template. Empty on a developer machine on purpose: the certificate is
# self-signed and the names are under a domain nobody here owns, so pinning them to https in the
# browser would outlast the stack. A deployment with a real certificate sets the variable.
#
# A hard include, not a wildcard: if the templates directory is not mounted, nginx refuses to start
# and says which file is missing. That is a better failure than starting without HSTS and finding
# out from a VAPT report.
include /etc/nginx/conf.d/hsts.conf;
