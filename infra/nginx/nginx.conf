# Single TLS entry point for the local stack.
#
#   https://admin.apigw.localhost      Management Portal   (+ /api/* to the control plane)
#   https://developer.apigw.localhost  Developer Portal    (+ /api/* to the control plane)
#   https://sandbox-api.apigw.localhost  partner traffic   -> APISIX sandbox
#   https://api.apigw.localhost          partner traffic   -> APISIX production
#
# Certificates come from infra/nginx/make-certs.sh and are mounted read-only at /etc/nginx/certs.
#
# The two control planes both sit behind this file. That is what makes the Java-to-Node migration
# gradual: a path is moved by editing one location block here, with no change to either portal.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    log_format  main  '$remote_addr - $host "$request" $status $body_bytes_sent '
                      '-> $upstream_addr ${upstream_response_time}s';
    access_log  /var/log/nginx/access.log main;

    # Portal bundles are hashed by Vite, so they compress once and cache forever.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ---------------------------------------------------------------- upstreams
    upstream backend_java {
        server backend-java:8088;
    }

    upstream backend_node {
        server backend-node:8089;
    }

    upstream portal_admin {
        server management-portal:80;
    }

    upstream portal_developer {
        server developer-portal:80;
    }

    upstream gateway_sandbox {
        server apisix-sandbox:9080;
    }

    upstream gateway_production {
        server apisix-production:9080;
    }

    # ---------------------------------------------------------------- shared TLS
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Everything on http is redirected; nothing is served in the clear.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------- proxy defaults
    # Included by every location that proxies, so the backends see the real client and scheme
    # rather than nginx's own address.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------- Management Portal
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.apigw.localhost;

        # Self-signed and local-only, so HSTS is deliberately not set: it would pin this browser to
        # https for the whole .localhost suffix long after the stack is gone.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 20m;   # OpenAPI and Postman imports

        # --- ported to Node: usage reporting and the audit list (read-only).
        # Move a path back by pointing it at backend_java; nothing else changes.
        location ~ ^/api/admin/(usage|audit)(/|$) {
            proxy_pass http://backend_node;
            include /etc/nginx/proxy.conf;
        }

        location /api/ {
            proxy_pass http://backend_java;
            include /etc/nginx/proxy.conf;
        }

        location /swagger-ui.html {
            proxy_pass http://backend_java;
            include /etc/nginx/proxy.conf;
        }

        location /v3/api-docs {
            proxy_pass http://backend_java;
            include /etc/nginx/proxy.conf;
        }

        location / {
            proxy_pass http://portal_admin;
            include /etc/nginx/proxy.conf;
        }
    }

    # ---------------------------------------------------------------- Developer Portal
    server {
        listen 443 ssl;
        http2 on;
        server_name developer.apigw.localhost;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 5m;

        location /api/ {
            proxy_pass http://backend_java;
            include /etc/nginx/proxy.conf;
        }

        location / {
            proxy_pass http://portal_developer;
            include /etc/nginx/proxy.conf;
        }
    }

    # ---------------------------------------------------------------- partner traffic
    # These two are the gateways themselves. Partners reach only these names; the portals and the
    # control plane are not exposed here.
    server {
        listen 443 ssl;
        http2 on;
        server_name sandbox-api.apigw.localhost;

        location / {
            proxy_pass http://gateway_sandbox;
            include /etc/nginx/proxy.conf;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.apigw.localhost;

        location / {
            proxy_pass http://gateway_production;
            include /etc/nginx/proxy.conf;
        }
    }

    # Anything else on 443 (an IP address, an unknown name) gets a flat refusal rather than a portal.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        return 444;
    }
}
