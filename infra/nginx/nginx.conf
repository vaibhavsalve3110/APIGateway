# Single TLS entry point for the local stack.
#
#   https://admin.apigw.com      Management Portal   (+ /api/* to the control plane)
#   https://developer.apigw.com  Developer Portal    (+ /api/* to the control plane)
#   https://sandbox-api.apigw.com  partner traffic   -> APISIX sandbox
#   https://api.apigw.com          partner traffic   -> APISIX production
#
# Certificates come from infra/nginx/make-certs.sh and are mounted read-only at /etc/nginx/certs.
#
# The control plane sits behind this file, and so does the per-route map that made the migration off
# backend-java gradual: a path moves by editing one line here, with no change to either portal.
# TLS settings are shared below; the response headers live in snippets/.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    log_format  main  '$remote_addr - $host "$request" $status $body_bytes_sent '
                      '-> $upstream_addr ${upstream_response_time}s';
    access_log  /var/log/nginx/access.log main;

    # Portal bundles are hashed by Vite, so they compress once and cache forever.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ---------------------------------------------------------------- the route map
    #
    # Which control plane answers a request, decided per method and path. Every route resolves to
    # backend-python now that backend-java is retired, so the explicit lines below are redundant
    # with the default — they are kept because this is the mechanism for pinning or diverting a
    # single route, and rebuilding it under pressure would be the wrong time to learn it.
    #
    # Method matters as much as path: /api/admin/apis is a list on GET and a create on POST. Each
    # pattern is anchored so a sub-resource such as /api/admin/partners/{id}/keys does not fall into
    # a prefix match meant for its parent.
    map "$request_method:$uri" $apigw_backend {
        # Everything. backend-java is retired: the schema, the three scheduled jobs, Try it
        # live, the importer and the demo seeder all moved to backend-python, so there is nothing
        # left for a fallback to reach.
        default                                                 "backend-python:8090";

        "~^GET:/api/admin/usage/(report|logs)$"                 "backend-python:8090";
        "~^GET:/api/admin/usage/apis/[0-9a-fA-F-]{36}/consumers$" "backend-python:8090";
        "~^GET:/api/admin/audit(/actors)?$"                     "backend-python:8090";

        "~^GET:/api/admin/partner-groups$"                      "backend-python:8090";
        "~^GET:/api/admin/partners$"                            "backend-python:8090";
        "~^GET:/api/admin/partners/[0-9a-fA-F-]{36}$"           "backend-python:8090";
        # Organization writes and credentials. Withdrawing production access and disabling an
        # organization answer 501 NOT_MIGRATED here, because both must revoke security keys and that
        # lifecycle is phase 5 -- but the paths carry other verbs too, so they still route here and
        # refuse explicitly rather than being half-applied.
        "~^POST:/api/admin/partner-groups$"                     "backend-python:8090";
        "~^POST:/api/admin/partners$"                           "backend-python:8090";
        "~^PUT:/api/admin/partners/[0-9a-fA-F-]{36}$"           "backend-python:8090";
        "~^PUT:/api/admin/partners/[0-9a-fA-F-]{36}/access-tier$" "backend-python:8090";
        "~^PUT:/api/admin/partners/[0-9a-fA-F-]{36}/status$"    "backend-python:8090";
        "~^POST:/api/admin/partners/[0-9a-fA-F-]{36}/signature$" "backend-python:8090";
        "~^POST:/api/admin/partners/[0-9a-fA-F-]{36}/ipv-salt$" "backend-python:8090";
        "~^POST:/api/admin/partners/[0-9a-fA-F-]{36}/ipv-salt/reveal$" "backend-python:8090";

        # Security keys. Key expiry is NOT here: it is a scheduled job, not a route. It runs in
        # backend-python with an advisory lock, so two instances cannot expire a key twice.
        "~^GET:/api/admin/partners/[0-9a-fA-F-]{36}/keys$"      "backend-python:8090";
        "~^POST:/api/admin/partners/[0-9a-fA-F-]{36}/keys/(SANDBOX|PRODUCTION)$" "backend-python:8090";
        "~^POST:/api/admin/keys/[0-9a-fA-F-]{36}/revoke$"       "backend-python:8090";
        "~^POST:/api/partner/keys/(SANDBOX|PRODUCTION)$"        "backend-python:8090";

        # Sign-in. All four move together and must stay together: the CAPTCHA is held in memory, so
        # a challenge issued by one service cannot be solved by the other.
        "~^POST:/api/auth/captcha$"                             "backend-python:8090";
        "~^POST:/api/auth/otp/(request|verify)$"                "backend-python:8090";
        "~^GET:/api/auth/me$"                                   "backend-python:8090";
        "~^GET:/api/admin/apis$"                                "backend-python:8090";
        "~^GET:/api/admin/apis/[0-9a-fA-F-]{36}$"               "backend-python:8090";
        # API writes. /import is NOT here: it is a whole OpenAPI and Postman parser built on
        # swagger-parser, and reproducing that library's output faithfully is its own piece of work.
        "~^POST:/api/admin/apis/import$"                        "backend-python:8090";
        "~^POST:/api/admin/apis$"                               "backend-python:8090";
        "~^PUT:/api/admin/apis/[0-9a-fA-F-]{36}$"               "backend-python:8090";
        "~^DELETE:/api/admin/apis/[0-9a-fA-F-]{36}$"            "backend-python:8090";
        "~^PUT:/api/admin/apis/[0-9a-fA-F-]{36}/guest-visibility$" "backend-python:8090";
        "~^POST:/api/admin/apis/[0-9a-fA-F-]{36}/(enable|disable)$" "backend-python:8090";
        "~^GET:/api/admin/dashboard$"                           "backend-python:8090";
        # These two have grown past backend-java: the audit log takes date, user and action
        # filters, and the error log takes date and partner filters and returns the organization each
        # failure belongs to. Routing either back to Java loses that silently -- the parameters are
        # ignored rather than rejected, and the page would quietly show everything.
        "~^GET:/api/admin/errors$"                              "backend-python:8090";

        # Products are ported whole — every verb, including the writes — so the prefix moves rather
        # than one method at a time. The partner-facing /api/partner/products is a different module
        # and is still Java.
        "~^[A-Z]+:/api/admin/products(/|$)"                     "backend-python:8090";
        "~^[A-Z]+:/api/admin/pages(/|$)"                        "backend-python:8090";
        "~^[A-Z]+:/api/admin/partner-users(/|$)"                "backend-python:8090";
        # Approvals and APIM users exist only on the Python side — backend-java has no equivalent,
        # so these cannot be routed back without the screens losing their backend entirely.
        "~^[A-Z]+:/api/admin/change-requests(/|$)"              "backend-python:8090";
        "~^[A-Z]+:/api/admin/platform-users(/|$)"               "backend-python:8090";
        # Only the users sub-resource of a partner is ported; /partners/{id}/keys and the rest of the
        # partner writes are still Java, which is why this names the segment explicitly.
        "~^[A-Z]+:/api/admin/partners/[0-9a-fA-F-]{36}/users$"  "backend-python:8090";

        # Developer Portal, read side. The two writes in this package stay on Java: generating a key
        # needs the cipher and the rotation rules, and Try-it-live calls the gateway.
        "~^GET:/api/me$"                                        "backend-python:8090";
        "~^GET:/api/partner/(me|apis|keys|products|pages|usage|dashboard)$" "backend-python:8090";
        "~^GET:/api/partner/usage/logs$"                        "backend-python:8090";
        "~^GET:/api/partner/apis/[0-9a-fA-F-]{36}$"             "backend-python:8090";
        "~^POST:/api/partner/apis/[0-9a-fA-F-]{36}/try$"        "backend-python:8090";
        "~^GET:/api/partner/(products|pages)/[a-z0-9-]+$"       "backend-python:8090";
    }

    # ---------------------------------------------------------------- upstreams
    # Docker's embedded DNS. Resolving at request time rather than at startup is what lets a backend
    # container be rebuilt without nginx holding on to its old address and answering 502.
    # Every proxy_pass in this file goes through a variable for that reason; there are deliberately
    # no upstream blocks, because a hostname inside one is resolved when the config loads and then
    # held for the life of the process.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------- shared TLS
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # AEAD with forward secrecy, and nothing else. `HIGH:!aNULL:!MD5` was here before, and it is
    # too broad in two ways a TLS scan picks up immediately:
    #
    #   * it offers CBC suites, which is what LUCKY13 is about — a padding-oracle timing attack on
    #     MAC-then-encrypt. The mitigations are constant-time implementations rather than a fix, so
    #     the answer is not to offer CBC at all.
    #   * it offers static-RSA AEAD suites (AES128-GCM-SHA256 without ECDHE). Those have **no
    #     forward secrecy**: recover the server key once and every past session is readable.
    #
    # TLS 1.3 needs no list — all five of its suites are AEAD with forward secrecy by definition.
    # This list is therefore TLS 1.2 only, and leaves TLS 1.2 with six suites, which every browser
    # and every TLS library of the last decade negotiates.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # The server's order, not the client's: otherwise a client may pick the weakest thing both ends
    # share, and the ordering above exists for a reason.
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve      X25519:prime256v1:secp384r1;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    # Session tickets are encrypted with a key nginx generates at start-up and never rotates for the
    # life of the worker, so a stolen ticket key decrypts every session resumed with it — which
    # undoes the forward secrecy the cipher list above was chosen for. The session cache above still
    # gives resumption, and it keeps its state on the server.
    ssl_session_tickets off;

    # Everything on http is redirected; nothing is served in the clear.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------- proxy defaults
    # Included by every location that proxies, so the backends see the real client and scheme
    # rather than nginx's own address.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------- Management Portal
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.apigw.com;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-portal.conf;

        client_max_body_size 20m;   # OpenAPI and Postman imports

        # $apigw_backend is the route map at the top of this file. Everything resolves to
        # backend-python now; the map is kept because it is how a route is moved or pinned.
        location /api/ {
            # No compression on API responses. A compressed response whose length varies with
            # attacker-chosen input is the BREACH precondition, and these bodies carry key reveals
            # and IPV salts. It costs nothing: under the production profile every one of them is an
            # encrypted envelope, and ciphertext does not compress.
            gzip off;
            proxy_pass http://$apigw_backend$request_uri;
            include /etc/nginx/proxy.conf;
        }

        # The API reference. Served by backend-python, which describes every operation's response
        # shape and declares the bearer scheme, so Authorize works and Try-it-out is usable. Its
        # springdoc counterpart on the Java side names controllers rather than resources and
        # describes no response bodies, so it is the poorer of the two to put in front of a reader.
        #
        # Worth knowing when trying a call from that page: the request goes back through this server,
        # so $apigw_backend decides which service answers it. The document describes the contract;
        # whichever control plane currently owns the route is what responds.
        #
        # Both of these re-include the shared headers: declaring a CSP of their own would otherwise
        # discard every add_header inherited from the server block above.
        location = /swagger-ui.html {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp-docs.conf;
            set $docs_backend backend-python:8090;
            proxy_pass http://$docs_backend$request_uri;
            include /etc/nginx/proxy.conf;
        }

        location = /v3/api-docs {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp-docs.conf;
            set $docs_backend backend-python:8090;
            proxy_pass http://$docs_backend$request_uri;
            include /etc/nginx/proxy.conf;
        }

        location / {
            set $portal_admin management-portal:80;
            proxy_pass http://$portal_admin$request_uri;
            include /etc/nginx/proxy.conf;
        }
    }

    # ---------------------------------------------------------------- Developer Portal
    server {
        listen 443 ssl;
        http2 on;
        server_name developer.apigw.com;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-portal.conf;

        client_max_body_size 5m;

        # The same route map, and the same reason for not compressing — see the Management Portal.
        location /api/ {
            gzip off;
            proxy_pass http://$apigw_backend$request_uri;
            include /etc/nginx/proxy.conf;
        }

        location / {
            set $portal_developer developer-portal:80;
            proxy_pass http://$portal_developer$request_uri;
            include /etc/nginx/proxy.conf;
        }
    }

    # ---------------------------------------------------------------- partner traffic
    # These two are the gateways themselves. Partners reach only these names; the portals and the
    # control plane are not exposed here.
    server {
        listen 443 ssl;
        http2 on;
        server_name sandbox-api.apigw.com;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api.conf;

        location / {
            set $gateway_sandbox apisix-sandbox:9080;
            proxy_pass http://$gateway_sandbox$request_uri;
            include /etc/nginx/proxy.conf;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.apigw.com;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api.conf;

        location / {
            set $gateway_production apisix-production:9080;
            proxy_pass http://$gateway_production$request_uri;
            include /etc/nginx/proxy.conf;
        }
    }

    # Anything else on 443 (an IP address, an unknown name) gets a flat refusal rather than a portal.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        return 444;
    }
}
