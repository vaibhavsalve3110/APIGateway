spring:
  application:
    name: apigw-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apigw}
    username: ${DB_USER:apigw}
    password: ${DB_PASSWORD:apigw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  # Sign-in is e-mail OTP: the platform mints and verifies its own session tokens (see AuthConfig),
  # so no OAuth2 resource-server settings are needed. Mail is optional locally; see OtpMailer.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8088}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Mail is optional (OtpMailer logs the code when no SMTP host is set), so a missing mail server
    # must not make the service look unhealthy to a load balancer.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

apigw:
  keys:
    # BRD v1.3, CP-SEC-04: the previous key stays valid for 20 minutes after a new key is generated.
    overlap-window: PT20M
  apis:
    # BRD CP-RPT-05: an API must stay Disabled for longer than this before it can be deleted.
    delete-cooling-period: P7D
  usage:
    # BRD CP-RPT-03: usage data is retained online for 30 days.
    retention: P30D
    ingest-token: ${USAGE_INGEST_TOKEN:change-me-ingest-token}
  security:
    # Header-based sign-in for running without Keycloak. Never enable outside a developer machine.
    dev-auth-enabled: false
  scheduling:
    enabled: true
  try-it:
    # GATEWAY = call the Sandbox gateway; SIMULATE = answer from the documented example (no gateway needed)
    mode: ${TRY_IT_MODE:GATEWAY}
    sandbox-url: ${TRY_IT_SANDBOX_URL:http://localhost:9080}
    public-sandbox-url: ${PUBLIC_SANDBOX_URL:http://sandbox-api.apigw.localhost:9080}
    timeout: PT10S
  auth:
    # Signs session tokens; at least 32 characters. Required under the prod profile.
    jwt-secret: ${AUTH_JWT_SECRET:}
    token-ttl: PT8H
    otp-ttl: PT5M
    otp-length: 6
    max-attempts: 5
    resend-cooldown: PT30S
    max-requests-per-window: 5
    request-window: PT15M
    mail-from: ${MAIL_FROM:no-reply@apigw.local}
    # true: an unregistered address is told so ("Invalid user"), which is what operators expect.
    # false: it gets the same answer as a registered one, so nobody can discover who holds an account.
    # Consider false for an internet-facing Developer Portal.
    reveal-unknown-email: ${REVEAL_UNKNOWN_EMAIL:true}
    # First Management Portal account, created only when the table is empty (see PlatformUserBootstrap).
    bootstrap-admin: ${BOOTSTRAP_ADMIN:admin@apigw.local}
  crypto:
    # 32 random bytes, base64: openssl rand -base64 32. Required under the prod profile; without it,
    # local runs fall back to a built-in development key and log a warning.
    master-key: ${CRYPTO_MASTER_KEY:}
  gateway:
    enabled: ${GATEWAY_SYNC_ENABLED:true}
    redis-host: ${GATEWAY_REDIS_HOST:valkey}
    redis-port: 6379
    # Where the gateways send per-call usage logs (http-logger). Must be reachable from the gateway containers.
    usage-sink-url: ${USAGE_SINK_URL:http://host.docker.internal:8088/internal/usage/batch}
    sandbox:
      admin-url: ${APISIX_SANDBOX_ADMIN_URL:http://localhost:9180}
      admin-key: ${APISIX_SANDBOX_ADMIN_KEY:change-me-sandbox-admin-key}
      hosts: [sandbox-api.apigw.localhost]
    production:
      admin-url: ${APISIX_PRODUCTION_ADMIN_URL:http://localhost:9181}
      admin-key: ${APISIX_PRODUCTION_ADMIN_KEY:change-me-production-admin-key}
      hosts: [api.apigw.localhost]
